<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" width="1000" height="190" role="img" aria-label="Speaker Identification with X-Vectors: 93% accuracy">
<style>

text{font-family:'Segoe UI','Helvetica Neue',Ubuntu,Arial,sans-serif}
.tilt{transform-box:view-box;transform-origin:500px 95px;animation:tilt 9s ease-in-out infinite}
@keyframes tilt{
 0%,100%{transform:skew(0deg,0deg) scale(1)}
 25%{transform:skew(-1.6deg,.5deg) scale(.985)}
 50%{transform:skew(0deg,-.6deg) scale(1)}
 75%{transform:skew(1.6deg,.5deg) scale(.985)}}
.shadow{transform-box:view-box;transform-origin:500px 95px;animation:shadow 9s ease-in-out infinite}
@keyframes shadow{
 0%,100%{transform:translate(0,6px)}
 25%{transform:translate(10px,8px)}
 50%{transform:translate(0,10px)}
 75%{transform:translate(-10px,8px)}}
.shine{animation:shine 6s ease-in-out infinite}
@keyframes shine{0%,30%{transform:translateX(-500px) skewX(-20deg)}70%,100%{transform:translateX(1300px) skewX(-20deg)}}
.chip{animation:up .8s cubic-bezier(.2,.7,.2,1) backwards}
.kick{animation:up .8s cubic-bezier(.2,.7,.2,1) .15s backwards}
@keyframes up{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}

.vb{transform-box:fill-box;transform-origin:center;animation:eq 1.1s ease-in-out infinite alternate}
@keyframes eq{0%{transform:scaleY(.3)}100%{transform:scaleY(1)}}
.pt{animation:conv 3.5s ease-in-out infinite}
@keyframes conv{0%{transform:translate(0,0);opacity:0}20%{opacity:1}70%,100%{transform:translate(var(--tx),var(--ty));opacity:.9}}
.core{transform-box:fill-box;transform-origin:center;animation:core 3.5s ease-in-out infinite}
@keyframes core{0%,60%{transform:scale(.6);opacity:.4}80%{transform:scale(1.2);opacity:1}100%{transform:scale(1);opacity:.8}}


@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>

<defs>
  <linearGradient id="gCxvector" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1B2A"/><stop offset="1" stop-color="#16324A"/></linearGradient>
  <linearGradient id="gExvector" x1="0" x2="1"><stop offset="0" stop-color="#58A6FF" stop-opacity=".7"/><stop offset=".5" stop-color="#5EEAD4" stop-opacity=".25"/><stop offset="1" stop-color="#58A6FF" stop-opacity=".7"/></linearGradient>
  <linearGradient id="gSxvector" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="fSxvector" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
  <clipPath id="clxvector"><rect x="16" y="14" width="968" height="158" rx="16"/></clipPath>
  <clipPath id="cmxvector"><rect x="0" y="0" width="284" height="158"/></clipPath>
</defs>
<rect class="shadow" x="30" y="20" width="940" height="150" rx="16" fill="#000" opacity=".35" filter="url(#fSxvector)"/>
<g class="tilt">
  <rect x="16" y="14" width="968" height="158" rx="16" fill="url(#gCxvector)" stroke="url(#gExvector)" stroke-width="1.5"/>
  <g clip-path="url(#clxvector)">
    <g transform="translate(16,14)"><g clip-path="url(#cmxvector)">
<rect class="vb" x="30" y="70" width="5" height="20" rx="2.5" fill="#58A6FF" style="animation-delay:-0.00s"/><rect class="vb" x="39" y="58" width="5" height="44" rx="2.5" fill="#58A6FF" style="animation-delay:-0.12s"/><rect class="vb" x="48" y="65" width="5" height="30" rx="2.5" fill="#58A6FF" style="animation-delay:-0.24s"/><rect class="vb" x="57" y="51" width="5" height="58" rx="2.5" fill="#58A6FF" style="animation-delay:-0.36s"/><rect class="vb" x="66" y="62" width="5" height="36" rx="2.5" fill="#58A6FF" style="animation-delay:-0.48s"/><rect class="vb" x="75" y="55" width="5" height="50" rx="2.5" fill="#58A6FF" style="animation-delay:-0.60s"/><rect class="vb" x="84" y="68" width="5" height="24" rx="2.5" fill="#58A6FF" style="animation-delay:-0.72s"/>
<circle class="pt" cx="126" cy="72" r="3" fill="#5EEAD4" style="--tx:89px;--ty:8px;animation-delay:0.00s"/><circle class="pt" cx="111" cy="90" r="3" fill="#5EEAD4" style="--tx:104px;--ty:-10px;animation-delay:0.12s"/><circle class="pt" cx="111" cy="52" r="3" fill="#5EEAD4" style="--tx:104px;--ty:28px;animation-delay:0.24s"/><circle class="pt" cx="121" cy="64" r="3" fill="#5EEAD4" style="--tx:94px;--ty:16px;animation-delay:0.36s"/><circle class="pt" cx="130" cy="49" r="3" fill="#5EEAD4" style="--tx:85px;--ty:31px;animation-delay:0.48s"/><circle class="pt" cx="125" cy="89" r="3" fill="#5EEAD4" style="--tx:90px;--ty:-9px;animation-delay:0.60s"/><circle class="pt" cx="126" cy="58" r="3" fill="#5EEAD4" style="--tx:89px;--ty:22px;animation-delay:0.72s"/><circle class="pt" cx="120" cy="76" r="3" fill="#5EEAD4" style="--tx:95px;--ty:4px;animation-delay:0.84s"/><circle class="pt" cx="119" cy="109" r="3" fill="#5EEAD4" style="--tx:96px;--ty:-29px;animation-delay:0.96s"/><circle class="pt" cx="130" cy="64" r="3" fill="#5EEAD4" style="--tx:85px;--ty:16px;animation-delay:1.08s"/>
<circle class="core" cx="215" cy="80" r="18" fill="none" stroke="#5EEAD4" stroke-width="2"/>
<circle cx="215" cy="80" r="5" fill="#5EEAD4"/>
<text x="215" y="124" text-anchor="middle" font-size="11" fill="#8B949E" style="font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace">x-vector</text>
</g></g>
    <line x1="300" y1="34" x2="300" y2="152" stroke="#58A6FF" stroke-opacity=".18"/>
    <text class="kick" x="330" y="50" font-size="13" font-weight="700" letter-spacing="2.2" fill="#5EEAD4" style="font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace">04 · SPEAKER IDENTIFICATION</text>
    <g class="chip" style="animation-delay:0.35s"><rect x="330" y="72" width="204" height="84" rx="10" fill="#ffffff" fill-opacity=".04" stroke="#58A6FF" stroke-opacity=".22"/><text x="346" y="112" font-size="29" font-weight="700" fill="#E6EDF3">93%</text><text x="346" y="139" font-size="12.5" fill="#8B949E">accuracy · multi-speaker</text></g><g class="chip" style="animation-delay:0.53s"><rect x="550" y="72" width="204" height="84" rx="10" fill="#ffffff" fill-opacity=".04" stroke="#58A6FF" stroke-opacity=".22"/><text x="566" y="112" font-size="29" font-weight="700" fill="#E6EDF3">X-Vector</text><text x="566" y="139" font-size="12.5" fill="#8B949E">embedding architecture</text></g><g class="chip" style="animation-delay:0.71s"><rect x="770" y="72" width="204" height="84" rx="10" fill="#ffffff" fill-opacity=".04" stroke="#58A6FF" stroke-opacity=".22"/><text x="786" y="112" font-size="29" font-weight="700" fill="#E6EDF3">ID + Verify</text><text x="786" y="139" font-size="12.5" fill="#8B949E">identify &amp; verify speakers</text></g>
    <rect class="shine" x="0" y="0" width="160" height="200" fill="url(#gSxvector)"/>
  </g>
</g>

</svg>
