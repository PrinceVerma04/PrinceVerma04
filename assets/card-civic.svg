<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" width="1000" height="190" role="img" aria-label="Civic Monitor: 0.80 mAP@50, 17,000+ images, ~26 MB INT8 TFLite">
<style>

text{font-family:'Segoe UI','Helvetica Neue',Ubuntu,Arial,sans-serif}
.tilt{transform-box:view-box;transform-origin:500px 95px;animation:tilt 9s ease-in-out infinite}
@keyframes tilt{
 0%,100%{transform:skew(0deg,0deg) scale(1)}
 25%{transform:skew(-1.6deg,.5deg) scale(.985)}
 50%{transform:skew(0deg,-.6deg) scale(1)}
 75%{transform:skew(1.6deg,.5deg) scale(.985)}}
.shadow{transform-box:view-box;transform-origin:500px 95px;animation:shadow 9s ease-in-out infinite}
@keyframes shadow{
 0%,100%{transform:translate(0,6px)}
 25%{transform:translate(10px,8px)}
 50%{transform:translate(0,10px)}
 75%{transform:translate(-10px,8px)}}
.shine{animation:shine 6s ease-in-out infinite}
@keyframes shine{0%,30%{transform:translateX(-500px) skewX(-20deg)}70%,100%{transform:translateX(1300px) skewX(-20deg)}}
.chip{animation:up .8s cubic-bezier(.2,.7,.2,1) backwards}
.kick{animation:up .8s cubic-bezier(.2,.7,.2,1) .15s backwards}
@keyframes up{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}

.road{animation:road 1.6s linear infinite}
@keyframes road{to{transform:translateX(-60px)}}
.det{stroke-dasharray:240;animation:det 3s ease-in-out infinite}
@keyframes det{0%{stroke-dashoffset:240;opacity:1}45%,85%{stroke-dashoffset:0;opacity:1}100%{opacity:0}}
.tag{animation:tag 3s ease-in-out infinite}
@keyframes tag{0%,40%{opacity:0}50%,85%{opacity:1}100%{opacity:0}}


@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>

<defs>
  <linearGradient id="gCcivic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1B2A"/><stop offset="1" stop-color="#16324A"/></linearGradient>
  <linearGradient id="gEcivic" x1="0" x2="1"><stop offset="0" stop-color="#58A6FF" stop-opacity=".7"/><stop offset=".5" stop-color="#5EEAD4" stop-opacity=".25"/><stop offset="1" stop-color="#58A6FF" stop-opacity=".7"/></linearGradient>
  <linearGradient id="gScivic" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="fScivic" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
  <clipPath id="clcivic"><rect x="16" y="14" width="968" height="158" rx="16"/></clipPath>
  <clipPath id="cmcivic"><rect x="0" y="0" width="284" height="158"/></clipPath>
</defs>
<rect class="shadow" x="30" y="20" width="940" height="150" rx="16" fill="#000" opacity=".35" filter="url(#fScivic)"/>
<g class="tilt">
  <rect x="16" y="14" width="968" height="158" rx="16" fill="url(#gCcivic)" stroke="url(#gEcivic)" stroke-width="1.5"/>
  <g clip-path="url(#clcivic)">
    <g transform="translate(16,14)"><g clip-path="url(#cmcivic)">
<path d="M0 140 L300 140 L300 80 L0 80 Z" fill="#0B1220"/>
<g class="road"><rect x="20" y="110" width="30" height="4" fill="#8B949E" opacity=".6"/><rect x="80" y="110" width="30" height="4" fill="#8B949E" opacity=".6"/><rect x="140" y="110" width="30" height="4" fill="#8B949E" opacity=".6"/><rect x="200" y="110" width="30" height="4" fill="#8B949E" opacity=".6"/><rect x="260" y="110" width="30" height="4" fill="#8B949E" opacity=".6"/><rect x="320" y="110" width="30" height="4" fill="#8B949E" opacity=".6"/><rect x="380" y="110" width="30" height="4" fill="#8B949E" opacity=".6"/></g>
<ellipse cx="150" cy="96" rx="34" ry="9" fill="#1F2937" stroke="#8B949E" stroke-opacity=".4"/>
<rect class="det" x="104" y="80" width="92" height="34" rx="3" fill="none" stroke="#5EEAD4" stroke-width="2"/>
<g class="tag"><rect x="104" y="60" width="64" height="18" rx="3" fill="#5EEAD4"/>
<text x="111" y="73" font-size="11" font-weight="700" fill="#0B1220" style="font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace">pothole</text></g>
<rect x="40" y="30" width="16" height="50" fill="#8B949E" opacity=".35"/><circle cx="48" cy="26" r="9" fill="#58A6FF" opacity=".35"/>
<rect x="240" y="40" width="30" height="40" fill="#8B949E" opacity=".25"/>
</g></g>
    <line x1="300" y1="34" x2="300" y2="152" stroke="#58A6FF" stroke-opacity=".18"/>
    <text class="kick" x="330" y="50" font-size="13" font-weight="700" letter-spacing="2.2" fill="#5EEAD4" style="font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace">02 · EDGE COMPUTER VISION</text>
    <g class="chip" style="animation-delay:0.35s"><rect x="330" y="72" width="204" height="84" rx="10" fill="#ffffff" fill-opacity=".04" stroke="#58A6FF" stroke-opacity=".22"/><text x="346" y="112" font-size="29" font-weight="700" fill="#E6EDF3">0.80</text><text x="346" y="139" font-size="12.5" fill="#8B949E">mAP@50 · 10 classes</text></g><g class="chip" style="animation-delay:0.53s"><rect x="550" y="72" width="204" height="84" rx="10" fill="#ffffff" fill-opacity=".04" stroke="#58A6FF" stroke-opacity=".22"/><text x="566" y="112" font-size="29" font-weight="700" fill="#E6EDF3">17,000+</text><text x="566" y="139" font-size="12.5" fill="#8B949E">real-world training images</text></g><g class="chip" style="animation-delay:0.71s"><rect x="770" y="72" width="204" height="84" rx="10" fill="#ffffff" fill-opacity=".04" stroke="#58A6FF" stroke-opacity=".22"/><text x="786" y="112" font-size="29" font-weight="700" fill="#E6EDF3">~26 MB</text><text x="786" y="139" font-size="12.5" fill="#8B949E">INT8 TFLite · fully offline</text></g>
    <rect class="shine" x="0" y="0" width="160" height="200" fill="url(#gScivic)"/>
  </g>
</g>

</svg>
