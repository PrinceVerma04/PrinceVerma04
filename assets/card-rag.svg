<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" width="1000" height="190" role="img" aria-label="NVIDIA NIM RAG Voice Assistant: Canary ASR, FAISS retrieval, NIM answers">
<style>

text{font-family:'Segoe UI','Helvetica Neue',Ubuntu,Arial,sans-serif}
.tilt{transform-box:view-box;transform-origin:500px 95px;animation:tilt 9s ease-in-out infinite}
@keyframes tilt{
 0%,100%{transform:skew(0deg,0deg) scale(1)}
 25%{transform:skew(-1.6deg,.5deg) scale(.985)}
 50%{transform:skew(0deg,-.6deg) scale(1)}
 75%{transform:skew(1.6deg,.5deg) scale(.985)}}
.shadow{transform-box:view-box;transform-origin:500px 95px;animation:shadow 9s ease-in-out infinite}
@keyframes shadow{
 0%,100%{transform:translate(0,6px)}
 25%{transform:translate(10px,8px)}
 50%{transform:translate(0,10px)}
 75%{transform:translate(-10px,8px)}}
.shine{animation:shine 6s ease-in-out infinite}
@keyframes shine{0%,30%{transform:translateX(-500px) skewX(-20deg)}70%,100%{transform:translateX(1300px) skewX(-20deg)}}
.chip{animation:up .8s cubic-bezier(.2,.7,.2,1) backwards}
.kick{animation:up .8s cubic-bezier(.2,.7,.2,1) .15s backwards}
@keyframes up{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}

.vb{transform-box:fill-box;transform-origin:center;animation:eq 1s ease-in-out infinite alternate}
@keyframes eq{0%{transform:scaleY(.3)}100%{transform:scaleY(1)}}
.flow{stroke-dasharray:4 6;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
.hl{animation:hl 3s ease-in-out infinite}
@keyframes hl{0%,100%{transform:translateY(0)}33%{transform:translateY(16px)}66%{transform:translateY(32px)}}


@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>

<defs>
  <linearGradient id="gCrag" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1B2A"/><stop offset="1" stop-color="#16324A"/></linearGradient>
  <linearGradient id="gErag" x1="0" x2="1"><stop offset="0" stop-color="#58A6FF" stop-opacity=".7"/><stop offset=".5" stop-color="#5EEAD4" stop-opacity=".25"/><stop offset="1" stop-color="#58A6FF" stop-opacity=".7"/></linearGradient>
  <linearGradient id="gSrag" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="fSrag" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
  <clipPath id="clrag"><rect x="16" y="14" width="968" height="158" rx="16"/></clipPath>
  <clipPath id="cmrag"><rect x="0" y="0" width="284" height="158"/></clipPath>
</defs>
<rect class="shadow" x="30" y="20" width="940" height="150" rx="16" fill="#000" opacity=".35" filter="url(#fSrag)"/>
<g class="tilt">
  <rect x="16" y="14" width="968" height="158" rx="16" fill="url(#gCrag)" stroke="url(#gErag)" stroke-width="1.5"/>
  <g clip-path="url(#clrag)">
    <g transform="translate(16,14)"><g clip-path="url(#cmrag)">
<rect class="vb" x="36" y="71" width="5" height="18" rx="2.5" fill="#5EEAD4" style="animation-delay:-0.00s"/><rect class="vb" x="45" y="63" width="5" height="34" rx="2.5" fill="#5EEAD4" style="animation-delay:-0.15s"/><rect class="vb" x="54" y="55" width="5" height="50" rx="2.5" fill="#5EEAD4" style="animation-delay:-0.30s"/><rect class="vb" x="63" y="65" width="5" height="30" rx="2.5" fill="#5EEAD4" style="animation-delay:-0.45s"/><rect class="vb" x="72" y="52" width="5" height="56" rx="2.5" fill="#5EEAD4" style="animation-delay:-0.60s"/><rect class="vb" x="81" y="60" width="5" height="40" rx="2.5" fill="#5EEAD4" style="animation-delay:-0.75s"/><rect class="vb" x="90" y="69" width="5" height="22" rx="2.5" fill="#5EEAD4" style="animation-delay:-0.90s"/><rect class="vb" x="99" y="58" width="5" height="44" rx="2.5" fill="#5EEAD4" style="animation-delay:-1.05s"/>
<path class="flow" d="M118 80 H178" stroke="#58A6FF" stroke-width="2.5" fill="none"/>
<path d="M174 74 L182 80 L174 86" stroke="#58A6FF" stroke-width="2.5" fill="none"/>
<rect x="186" y="38" width="80" height="92" rx="8" fill="#0B1220" stroke="#8B949E" stroke-opacity=".5"/>
<rect class="hl" x="190" y="50" width="72" height="13" rx="3" fill="#58A6FF" opacity=".3"/>
<rect x="196" y="54" width="60" height="5" rx="2" fill="#8B949E" opacity=".6"/><rect x="196" y="70" width="44" height="5" rx="2" fill="#8B949E" opacity=".6"/><rect x="196" y="86" width="60" height="5" rx="2" fill="#8B949E" opacity=".6"/><rect x="196" y="102" width="44" height="5" rx="2" fill="#8B949E" opacity=".6"/>
</g></g>
    <line x1="300" y1="34" x2="300" y2="152" stroke="#58A6FF" stroke-opacity=".18"/>
    <text class="kick" x="330" y="50" font-size="13" font-weight="700" letter-spacing="2.2" fill="#5EEAD4" style="font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace">03 · VOICE RAG</text>
    <g class="chip" style="animation-delay:0.35s"><rect x="330" y="72" width="204" height="84" rx="10" fill="#ffffff" fill-opacity=".04" stroke="#58A6FF" stroke-opacity=".22"/><text x="346" y="112" font-size="29" font-weight="700" fill="#E6EDF3">ASR</text><text x="346" y="139" font-size="12.5" fill="#8B949E">NVIDIA Canary voice queries</text></g><g class="chip" style="animation-delay:0.53s"><rect x="550" y="72" width="204" height="84" rx="10" fill="#ffffff" fill-opacity=".04" stroke="#58A6FF" stroke-opacity=".22"/><text x="566" y="112" font-size="29" font-weight="700" fill="#E6EDF3">FAISS</text><text x="566" y="139" font-size="12.5" fill="#8B949E">retrieval · NVIDIA embeddings</text></g><g class="chip" style="animation-delay:0.71s"><rect x="770" y="72" width="204" height="84" rx="10" fill="#ffffff" fill-opacity=".04" stroke="#58A6FF" stroke-opacity=".22"/><text x="786" y="112" font-size="29" font-weight="700" fill="#E6EDF3">NIM</text><text x="786" y="139" font-size="12.5" fill="#8B949E">grounded, source-linked answers</text></g>
    <rect class="shine" x="0" y="0" width="160" height="200" fill="url(#gSrag)"/>
  </g>
</g>

</svg>
