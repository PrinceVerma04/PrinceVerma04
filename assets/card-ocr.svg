<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" width="1000" height="190" role="img" aria-label="Meter Serial OCR: 15x faster on CPU, 96.8% precision, 81 to 21 MB INT8 model">
<style>

text{font-family:'Segoe UI','Helvetica Neue',Ubuntu,Arial,sans-serif}
.tilt{transform-box:view-box;transform-origin:500px 95px;animation:tilt 9s ease-in-out infinite}
@keyframes tilt{
 0%,100%{transform:skew(0deg,0deg) scale(1)}
 25%{transform:skew(-1.6deg,.5deg) scale(.985)}
 50%{transform:skew(0deg,-.6deg) scale(1)}
 75%{transform:skew(1.6deg,.5deg) scale(.985)}}
.shadow{transform-box:view-box;transform-origin:500px 95px;animation:shadow 9s ease-in-out infinite}
@keyframes shadow{
 0%,100%{transform:translate(0,6px)}
 25%{transform:translate(10px,8px)}
 50%{transform:translate(0,10px)}
 75%{transform:translate(-10px,8px)}}
.shine{animation:shine 6s ease-in-out infinite}
@keyframes shine{0%,30%{transform:translateX(-500px) skewX(-20deg)}70%,100%{transform:translateX(1300px) skewX(-20deg)}}
.chip{animation:up .8s cubic-bezier(.2,.7,.2,1) backwards}
.kick{animation:up .8s cubic-bezier(.2,.7,.2,1) .15s backwards}
@keyframes up{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}

.scan{animation:scan 3.2s ease-in-out infinite alternate}
@keyframes scan{0%{transform:translateY(0)}100%{transform:translateY(96px)}}
.lock{animation:lock 3.2s ease-in-out infinite}
@keyframes lock{0%,40%{opacity:0;transform:scale(1.15)}55%,90%{opacity:1;transform:scale(1)}100%{opacity:0}}
.lock{transform-box:fill-box;transform-origin:center}


@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>

<defs>
  <linearGradient id="gCocr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1B2A"/><stop offset="1" stop-color="#16324A"/></linearGradient>
  <linearGradient id="gEocr" x1="0" x2="1"><stop offset="0" stop-color="#58A6FF" stop-opacity=".7"/><stop offset=".5" stop-color="#5EEAD4" stop-opacity=".25"/><stop offset="1" stop-color="#58A6FF" stop-opacity=".7"/></linearGradient>
  <linearGradient id="gSocr" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="fSocr" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
  <clipPath id="clocr"><rect x="16" y="14" width="968" height="158" rx="16"/></clipPath>
  <clipPath id="cmocr"><rect x="0" y="0" width="284" height="158"/></clipPath>
</defs>
<rect class="shadow" x="30" y="20" width="940" height="150" rx="16" fill="#000" opacity=".35" filter="url(#fSocr)"/>
<g class="tilt">
  <rect x="16" y="14" width="968" height="158" rx="16" fill="url(#gCocr)" stroke="url(#gEocr)" stroke-width="1.5"/>
  <g clip-path="url(#clocr)">
    <g transform="translate(16,14)"><g clip-path="url(#cmocr)">
<rect x="40" y="26" width="200" height="110" rx="10" fill="#0B1220" stroke="#8B949E" stroke-opacity=".5"/>
<circle cx="140" cy="62" r="20" fill="none" stroke="#8B949E" stroke-opacity=".5" stroke-width="2"/>
<path d="M140 62 L152 52" stroke="#5EEAD4" stroke-width="2"/>
<text x="140" y="112" text-anchor="middle" font-size="15" fill="#E6EDF3" letter-spacing="2" style="font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace">SN 7A20481</text>
<g class="lock"><rect x="66" y="96" width="148" height="24" rx="4" fill="none" stroke="#5EEAD4" stroke-width="2"/></g>
<rect class="scan" x="44" y="30" width="192" height="3" fill="#5EEAD4" opacity=".7"/>
</g></g>
    <line x1="300" y1="34" x2="300" y2="152" stroke="#58A6FF" stroke-opacity=".18"/>
    <text class="kick" x="330" y="50" font-size="13" font-weight="700" letter-spacing="2.2" fill="#5EEAD4" style="font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace">01 · PRODUCTION OCR</text>
    <g class="chip" style="animation-delay:0.35s"><rect x="330" y="72" width="204" height="84" rx="10" fill="#ffffff" fill-opacity=".04" stroke="#58A6FF" stroke-opacity=".22"/><text x="346" y="112" font-size="29" font-weight="700" fill="#E6EDF3">15×</text><text x="346" y="139" font-size="12.5" fill="#8B949E">faster on CPU · 304 → 20 ms</text></g><g class="chip" style="animation-delay:0.53s"><rect x="550" y="72" width="204" height="84" rx="10" fill="#ffffff" fill-opacity=".04" stroke="#58A6FF" stroke-opacity=".22"/><text x="566" y="112" font-size="29" font-weight="700" fill="#E6EDF3">96.8%</text><text x="566" y="139" font-size="12.5" fill="#8B949E">precision · auto-accept gate</text></g><g class="chip" style="animation-delay:0.71s"><rect x="770" y="72" width="204" height="84" rx="10" fill="#ffffff" fill-opacity=".04" stroke="#58A6FF" stroke-opacity=".22"/><text x="786" y="112" font-size="29" font-weight="700" fill="#E6EDF3">81→21 MB</text><text x="786" y="139" font-size="12.5" fill="#8B949E">INT8 quantized model</text></g>
    <rect class="shine" x="0" y="0" width="160" height="200" fill="url(#gSocr)"/>
  </g>
</g>

</svg>
